{% extends 'qa_app/base.html' %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header bg-success text-white text-center">
          <h4>Upload Job Description (JD)</h4>
        </div>
        <div class="card-body">
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
          <form method="post" enctype="multipart/form-data" class="mb-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100">Upload JD PDF</button>
          </form>
          <hr>
          <h6 class="text-center">Or Paste JD Text</h6>
          <form method="post">
            {% csrf_token %}
            {{ text_form.as_p }}
            <button type="submit" class="btn btn-secondary w-100">Save JD Text</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
