{% extends 'qa_app/base.html' %}
{% load static %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
          <h4>Upload Your Resume (PDF)</h4>
        </div>
        <div class="mt-3 text-end">
          <form method="post" action="{% url 'clear_resumes' %}" onsubmit="return confirm('Are you sure you want to delete all uploaded resumes?');" style="display:inline-block;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-sm">Clear All Resumes</button>
          </form>
          <form method="post" action="{% url 'reset_system' %}" onsubmit="return confirm('Are you sure you want to reset the system? This will delete all resumes, job descriptions, and chat history.');" style="display:inline-block; margin-left:10px;">
            {% csrf_token %}
            <button type="submit" class="btn btn-warning btn-sm">Reset System</button>
          </form>
        </div>
        <div class="card-body">
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Upload</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
